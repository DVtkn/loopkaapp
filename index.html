<!doctype html>
<html lang="ru">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, error: e.error ? e.error.stack : null })
        }).catch(function(){});
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: e.reason ? e.reason.toString() : 'Promise Rejection', stack: e.reason && e.reason.stack })
        }).catch(function(){});
      });
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Loop • Психология отношений и гармония пары</title>
    <meta name="description" content="Loop — умное приложение для двоих: глубокие тесты совместимости Готтмана и ЭФТ, детальная аналитика отношений, планирование свиданий и ИИ-психолог Сова." />
    
    <!-- Google Fonts: Inter (Instagram default), Golos Text, Manrope with full Cyrillic support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- iOS Web App Meta Tags (Add to Home Screen & Push Notification Support) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="msapplication-navbutton-color" content="#FF3B30" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <meta property="og:image" content="/icon.svg" />
  </head>
